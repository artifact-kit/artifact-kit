<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@artifact-kit/pptxgenjs-jsx browser JSX example</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        width: min(720px, calc(100vw - 32px));
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #111827;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 16px;
      }

      pre {
        overflow: auto;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #ffffff;
        padding: 16px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@artifact-kit/pptxgenjs-jsx": "../dist/pptxgenjs-jsx.browser.es.js",
          "@artifact-kit/pptxgenjs-jsx/jsx-runtime": "../dist/jsx-runtime.browser.es.js",
          "@artifact-kit/pptxgenjs-jsx/jsx-dev-runtime": "../dist/jsx-runtime.browser.es.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Browser JSX to PPTX</h1>
      <p>This local HTML file uses Babel Standalone to compile JSX in the browser, then downloads a PPTX.</p>
      <button id="download">Download PPTX</button>
      <pre id="status">Ready</pre>
    </main>

    <script type="text/babel" data-type="module" data-presets="typescript,react">
      /** @jsx pptxElement */
      import {
        BarChart,
        Deck,
        RoundRect,
        Slide,
        Text,
        TextRun,
        pptxElement,
        validateDeck,
        renderPptx,
      } from "@artifact-kit/pptxgenjs-jsx";

      const status = document.querySelector("#status");

      const deck = (
        <Deck title="Browser JSX Demo" author="artifact-kit" layout={{ name: "WIDE", width: 13.333, height: 7.5 }}>
          <Slide background={{ color: "FFFFFF" }}>
            <RoundRect x={0.7} y={0.55} w={4.4} h={0.75} rectRadius={0.08} fill={{ color: "EEF2FF" }} line={{ color: "C7D2FE", width: 1 }} />
            <Text x={0.95} y={0.78} w={3.9} h={0.28} fontSize={18} bold color="111827" margin={0}>
              Browser-authored JSX
            </Text>
            <Text x={0.95} y={1.55} w={5.7} h={0.5} fontSize={16} color="374151" margin={0}>
              <TextRun text="Compiled locally with " options={{ color: "374151" }} />
              <TextRun text="Babel Standalone" options={{ color: "4F46E5", bold: true }} />
              <TextRun text=", rendered with PptxGenJS." options={{ color: "374151" }} />
            </Text>
            <BarChart
              data={[{ name: "Output", labels: ["Draft", "Review", "Final"], values: [8, 14, 21] }]}
              x={0.95}
              y={2.55}
              w={7.4}
              h={3.55}
              showLegend={false}
              showValue
              chartColors={["4F46E5"]}
              catAxisLabelColor="111827"
              valAxisHidden
            />
          </Slide>
        </Deck>
      );

      document.querySelector("#download").addEventListener("click", async () => {
        const issues = validateDeck(deck);
        if (issues.some((issue) => issue.level === "error")) {
          status.textContent = JSON.stringify(issues, null, 2);
          return;
        }

        status.textContent = "Rendering...";
        await renderPptx(deck, { fileName: "browser-jsx-demo.pptx" });
        status.textContent = "Downloaded browser-jsx-demo.pptx";
      });
    </script>
  </body>
</html>
